id: makeup
name: Makeup
version: 1.1.1
description: Makeup controls for the Beauty tab.

# The plugins that must be installed first. Makeup does not carry the AI models it uses to find the lips.
dependencies:
  - id: person-detection
  - id: face-parsing
  - id: face-landmarks

contributes:
  controls:
    # The tab and group they go in, by the names people see. A tab or group that is not there is made.
    - root: Beauty/Makeup
      items:
        - path: Lipstick
          entry: lipstick.js
        - path: Lip Liner
          entry: lip-liner.js
        - path: Eyeliner
          entry: eyeliner.js
        - path: Eyeshadow
          entry: eyeshadow.js
        - path: Brow Highlight
          entry: brow-highlight.js
        - path: Concealer
          entry: concealer.js
        - path: Blush
          entry: blush-control.js
        - path: Highlighter
          entry: highlighter.js
        - path: Face Shaping
          entry: face-shaping.js

# What the phone downloads. `node scripts/build-plugins.mjs` builds these from src and writes the hashes.
files:
