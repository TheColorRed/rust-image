$schema: https://alakazam-image-editor.s3.us-east-1.amazonaws.com/plugins/plugin.schema.json
id: alakazam.makeup
name: Makeup
version: 1.1.2
description: Makeup controls for the Beauty tab.

# The plugins that must be installed first. Makeup does not carry the AI models it uses to find the lips.
dependencies:
  - id: alakazam.person-detection
  - id: alakazam.face-parsing
  - id: alakazam.face-landmarks

contributes:
  controls:
    # The tab and group they go in, by the names people see. A tab or group that is not there is made.
    - root: Beauty/Makeup
      items:
        - path: Lipstick
          entry: lipstick.js
        - path: Lip Liner
          entry: lip-liner.js
        - path: Eyeliner
          entry: eyeliner.js
        - path: Eyeshadow
          entry: eyeshadow.js
        - path: Brow Highlight
          entry: brow-highlight.js
        - path: Concealer
          entry: concealer.js
        - path: Blush
          entry: blush-control.js
        - path: Highlighter
          entry: highlighter.js
        - path: Face Shaping
          entry: face-shaping.js

# What the phone downloads. `node scripts/build-plugins.mjs` builds these from src and writes the hashes.
files:
  - path: lipstick.js
    sha256: f0de4b7d6138f7c15edffecf3c442763ba2175dc798223eee1f2923d4065475f
  - path: lip-liner.js
    sha256: 36aa1745c710931b474e9dc657f9f0b9754dfff4cb1528cf4cc21b29af841fe7
  - path: eyeliner.js
