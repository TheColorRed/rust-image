$schema: https://alakazam-image-editor.s3.us-east-1.amazonaws.com/plugins/plugin.schema.json
id: alakazam.beauty
name: Beauty
version: 1.2.1
description: Beauty and makeup controls for the Beauty tab.

dependencies:
  - id: alakazam.person-detection
  - id: alakazam.face-parsing
  - id: alakazam.face-landmarks
  - id: alakazam.skin-segmentation

contributes:
  controls:
    - root: Beauty/Skin
      items:
        - path: Even Skin Tone
          entry: skin/skin-even-out.js
        - path: Tan
          entry: skin/skin-tan.js
        - path: Lighten and Darken
          entry: skin/skin-tone.js
        - path: Smooth
          entry: skin/skin-smooth.js
    - root: Beauty
      items:
        - path: Teeth Whitening
          entry: retouch/teeth-whitening.js
        - path: Red Eye
          entry: retouch/red-eye.js
        - path: Blemish
          entry: retouch/blemish.js
        - path: Hair
          entry: hair/hair.js
    - root: Beauty/Makeup
      items:
        - path: Lipstick
          entry: makeup/lipstick.js
        - path: Lip Liner
          entry: makeup/lip-liner.js
        - path: Eyeliner
          entry: makeup/eyeliner.js
        - path: Eyeshadow
          entry: makeup/eyeshadow.js
        - path: Brow Highlight
          entry: makeup/brow-highlight.js
        - path: Concealer
          entry: makeup/concealer.js
        - path: Blush
          entry: makeup/blush-control.js
        - path: Highlighter
          entry: makeup/highlighter.js
        - path: Face Shaping
          entry: makeup/face-shaping.js

