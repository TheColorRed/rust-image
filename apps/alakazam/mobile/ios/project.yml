name: Alakazam
options:
  deploymentTarget:
    iOS: '15.1'
targets:
  Alakazam:
    type: application
    platform: iOS
    sources:
      - path: Alakazam
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alakazam.mobile
        SWIFT_VERSION: '5.0'
        CLANG_ENABLE_MODULES: 'YES'
        ENABLE_USER_SCRIPT_SANDBOXING: 'NO'
        CODE_SIGNING_ALLOWED: 'NO'
        CODE_SIGNING_REQUIRED: 'NO'
        TARGETED_DEVICE_FAMILY: '1,2'
        MARKETING_VERSION: '0.1.0'
        CURRENT_PROJECT_VERSION: '1'
    info:
      path: Alakazam/Info.plist
      properties:
        CFBundleDisplayName: Alakazam
        LSRequiresIPhoneOS: true
        RCTNewArchEnabled: true
        dev.vessel.library: alakazam_mobile
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities:
          - arm64
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSPhotoLibraryUsageDescription: Select photos to edit.
        NSPhotoLibraryAddUsageDescription: Save edited photos to your library.
    preBuildScripts:
      - name: Bundle React Native code and images
        basedOnDependencyAnalysis: false
        script: |
          export NODE_BINARY="$(command -v node)"
          REACT_NATIVE_PATH="$(cd "$SRCROOT/.." && node --print "require('path').dirname(require.resolve('react-native/package.json'))")"
          /bin/sh "$REACT_NATIVE_PATH/scripts/xcode/with-environment.sh" "$REACT_NATIVE_PATH/scripts/react-native-xcode.sh"
schemes:
  Alakazam:
    build:
      targets:
        Alakazam: all
    archive:
      config: Release