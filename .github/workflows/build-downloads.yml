name: Build downloadable apps

on:
  workflow_dispatch:
    inputs:
      desktop:
        description: Build the Windows desktop app
        type: boolean
        default: true
      android:
        description: Build the Android mobile app
        type: boolean
        default: true
      ios:
        description: Build the iOS mobile app
        type: boolean
        default: true
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  FONTAWESOME_NPM_AUTH_TOKEN: ${{ secrets.FONTAWESOME_NPM_AUTH_TOKEN }}

jobs:
  desktop:
    name: Desktop (Windows)
    if: github.event_name != 'workflow_dispatch' || inputs.desktop
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Build native desktop binding
        run: npm run build-bindings

      - name: Build desktop application
        env:
          NODE_ENV: production
        run: |
          node apps/alakazam/desktop/scripts/move-bindings.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build -w apps/alakazam/desktop
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force apps/alakazam/desktop/dist/client | Out-Null
          Copy-Item apps/alakazam/desktop/dist/renderer/* apps/alakazam/desktop/dist/client -Recurse -Force

      # JavaScript dependencies are bundled by webpack. Copy the native workspace
      # package explicitly so the staged app does not rely on workspace symlinks.
      - name: Package portable Windows executable
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force release/desktop-source/dist, release/desktop-source/node_modules/@alakazam/core | Out-Null
          Copy-Item apps/alakazam/desktop/dist/* release/desktop-source/dist -Recurse -Force
          Copy-Item packages/node/alakazam/package.json, packages/node/alakazam/alakazam.node release/desktop-source/node_modules/@alakazam/core
          $app = Get-Content apps/alakazam/desktop/package.json -Raw | ConvertFrom-Json
          @{ name = $app.name; version = $app.version; main = $app.main; description = 'Alakazam image editor' } |
            ConvertTo-Json | Set-Content release/desktop-source/package.json
          $electronVersion = node -p "require('electron/package.json').version"
          npx --yes @electron/packager release/desktop-source Alakazam --platform=win32 --arch=x64 --electron-version=$electronVersion --out=release/desktop --overwrite --prune=false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $config = (Resolve-Path apps/alakazam/desktop/electron-builder.json).Path
          $packagedApp = (Resolve-Path release/desktop/Alakazam-win32-x64).Path
          npx --yes electron-builder@26.15.3 --projectDir release/desktop-source --config $config --config.electronVersion=$electronVersion --prepackaged $packagedApp --win portable --x64 --publish never
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path release/Alakazam-windows-x64.exe)) { throw 'Portable Windows executable was not generated' }

      - name: Upload desktop build
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: release/Alakazam-windows-x64.exe
          if-no-files-found: error
          retention-days: 30

  android-mobile:
    name: Mobile (Android release)
    if: github.event_name != 'workflow_dispatch' || inputs.android
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - uses: android-actions/setup-android@v4

      - name: Install Android build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006" "cmake;3.31.6"

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Build native Android binding (release)
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.1.12297006"
          export ANDROID_CMAKE_HOME="$ANDROID_HOME/cmake/3.31.6"
          npm run build-bindings:android -- --release

      - name: Build Android APK (release)
        working-directory: apps/alakazam/mobile/android
        run: bash ./gradlew assembleRelease

      - name: Stage Android APK
        run: |
          mkdir -p release
          cp apps/alakazam/mobile/android/app/build/outputs/apk/release/app-release.apk release/Alakazam-android-release.apk

      - name: Upload mobile build (release)
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: release/Alakazam-android-release.apk
          if-no-files-found: error
          retention-days: 30

  ios-mobile:
    name: Mobile (iOS unsigned IPA)
    if: github.event_name != 'workflow_dispatch' || inputs.ios
    runs-on: macos-latest
    env:
      IPHONEOS_DEPLOYMENT_TARGET: '15.1'

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Build native iOS binding (release)
        run: |
          for target in aarch64_apple_ios aarch64_apple_ios_sim x86_64_apple_ios; do
            export "CMAKE_TOOLCHAIN_FILE_$target=$GITHUB_WORKSPACE/.github/cmake/ios.cmake"
          done
          npm exec --workspace packages/react-native/alakazam -- ubrn build jsi2 ios --release --and-generate --config ubrn.config.yaml

      - name: Install iOS app build tools
        run: brew install xcodegen cocoapods

      - name: Generate iOS app project and install Pods
        working-directory: apps/alakazam/mobile/ios
        run: |
          xcodegen generate --spec project.yml
          pod install

      - name: Build unsigned iOS app
        run: |
          xcodebuild \
            -workspace apps/alakazam/mobile/ios/Alakazam.xcworkspace \
            -scheme Alakazam \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$GITHUB_WORKSPACE/release/Alakazam.xcarchive" \
            -derivedDataPath "$GITHUB_WORKSPACE/apps/alakazam/mobile/ios/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive

      - name: Package unsigned iOS IPA
        run: |
          mkdir -p release/Payload
          ditto release/Alakazam.xcarchive/Products/Applications/Alakazam.app release/Payload/Alakazam.app
          test -f release/Payload/Alakazam.app/Info.plist
          test -f release/Payload/Alakazam.app/main.jsbundle
          cd release
          ditto -c -k --keepParent Payload Alakazam-ios-unsigned.ipa

      - name: Upload unsigned iOS IPA
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: release/Alakazam-ios-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
