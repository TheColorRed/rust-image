[package]
name = "alakazam-mobile"
version = "0.1.0"
edition = "2024"

[dependencies]
abra = { workspace = true, features = ["uniffi", "live"] }
uniffi = "=0.31"

[features]
default = ["gpu"]
# Renders live previews on the GPU; without it they run on the CPU.
gpu = ["abra/gpu"]

[lib]
# `cdylib` is the lib<name>.so the @ubjs/react-native player dlopens;
# `lib` lets ubrn read the uniffi metadata.
crate-type = ["lib", "cdylib"]
name = "alakazam_mobile"

[target.'cfg(target_os = "android")'.dependencies]
# Turns the Surface behind a native preview view into the ANativeWindow that wgpu draws to.
ndk-sys = "0.6"
