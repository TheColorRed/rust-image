---
name: AlakazamMobile
rust:
  # The cargo workspace root, relative to this package.
  directory: ../../..
  manifestPath: packages/react-native/alakazam/Cargo.toml
bindings:
  ts: src/generated
turboModule:
  # The file the generator writes, which nothing imports: the package entry (`src/app.ts`, in package.json) is written by hand
  # and does its work. It is out of `src` so that editors do not offer its exports, which include the whole Abra library.
  entrypoint: .ubrn/index.tsx
android:
  apiLevel: 24
jsi2:
  # The @ubjs/react-native player ships only these two ABIs.
  androidTargets:
    - arm64-v8a
    - x86_64
