# BiSeNet ResNet18 Face-Parsing Model
#
# Purpose: Pixel-level labels for 19 facial regions, including eyes, eyebrows, ears, nose, lips, hair, and skin
# Input: RGB float32 tensor [1, 3, 512, 512], ImageNet normalized (NCHW)
# Preprocessing: Bilinear resize to 512x512, then (value / 255 - mean) / standard deviation
# Output: Float32 logits [1, 19, 512, 512]; select the largest logit per pixel

name: bisenet-resnet18-face-parsing
decoder: label-map
description: 19-class facial feature masks for precise portrait adjustments
source: https://github.com/yakhyo/face-parsing
license: MIT
sha256: 0d9bd318e46987c3bdbfacae9e2c0f461cae1c6ac6ea6d43bbe541a91727e33f

# How Abra feeds the model and reads its answer (see abra-ai-core: InputSpec and Decoder).
params:
  input_size: 512
  input_layout: nchw
  input_fit: stretch
  output_layout: nchw
  class_count: 19
  input_mean: [0.485, 0.456, 0.406]
  input_standard_deviation: [0.229, 0.224, 0.225]

classes:
  - background
  - skin
  - left eyebrow
  - right eyebrow
  - left eye
  - right eye
  - eyeglasses
  - left ear
  - right ear
  - earring
  - nose
  - mouth
  - upper lip
  - lower lip
  - neck
  - neckwear
  - clothing
  - hair
  - hat
