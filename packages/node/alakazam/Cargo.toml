[package]
name = "alakazam"
version = "0.1.0"
edition = "2024"

[dependencies]
napi = { workspace = true, features = ["napi4"] }
napi-derive = { workspace = true }
abra = { workspace = true }

[features]
# Renders live previews on the GPU; without it they run on the CPU.
gpu = ["abra/gpu"]

[lib]
crate-type = ["cdylib", "rlib"]
name = "alakazam"

[build-dependencies]
napi-build = "2"
