[package]
name = "surface"
version = "0.1.0"
edition = "2024"
description = "Surfaces that frames are drawn on, looked up by id: native windows, and views owned by a host application."

# This crate must stay free of abra crates so it can be published on its own.
#
# Every platform is a feature and none is on by default, so an app compiles only what it uses. A feature on a platform
# it does not target compiles to nothing.
[features]
default = []
# `*-surface`: inline component style, drawing inside a view that a host application owns.
# An Android `Surface` handed over by any host UI (React Native, Flutter, a Java or Kotlin app).
android-surface = ["android-native-window"]
# A retained Metal layer handed over by an iOS host UI.
ios-surface = []
# `*-window`: a standalone app or game, where Vessel owns the window and the main loop.
# A native desktop window (Windows first), bordered or borderless. Drawn with the CPU.
desktop-window = ["dep:winit", "dep:softbuffer"]
# Internal: the Android window kind that both `android-surface` and, later, `android-window` draw on.
android-native-window = ["dep:ndk-sys"]

[dependencies]
pub-sub = { workspace = true }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
winit = { version = "0.30", optional = true }
softbuffer = { version = "0.4", optional = true }

[target.'cfg(target_os = "android")'.dependencies]
# Turns an Android `Surface` into the `ANativeWindow` that is drawn on.
ndk-sys = { version = "0.6", optional = true }

[lib]
name = "surface"
