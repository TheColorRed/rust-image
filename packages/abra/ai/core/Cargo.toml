[package]
name = "abra-ai-core"
version = "1.0.0"
edition = "2024"
description = "Lightweight AI model loading for Abra"

[dependencies]
abra-core = { workspace = true }
ndarray = { workspace = true }
rayon = { workspace = true }
saphyr = { workspace = true }

[target.'cfg(not(target_os = "android"))'.dependencies]
ort = { version = "2.0.0-rc.13" }

[target.'cfg(target_os = "android")'.dependencies]
ort = { version = "2.0.0-rc.13", default-features = false, features = [
  "api-27",
  "ndarray",
  "std",
  "load-dynamic",
] }

[features]
default = []
onnx = []

[lib]
crate-type = ["rlib"]
