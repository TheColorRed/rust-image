# Robust Video Matting (RVM), MobileNetV3 backbone, float32
#
# Purpose: Trimap-free matting of people. Gives a soft alpha (hair strands included), not a hard silhouette.
# Origin: https://github.com/PeterL1n/RobustVideoMatting (Peter Lin et al., "Robust High-Resolution Video Matting
#   with Temporal Guidance"), release v1.0.0
# Inputs: src [1, 3, height, width] RGB float32 in 0..1, any size;
#   r1i, r2i, r3i, r4i recurrent states, float32 (zeros of shape [1, 1, 1, 1] start a new clip);
#   downsample_ratio float32 [1]
# Outputs: fgr [1, 3, height, width], pha [1, 1, height, width] in 0..1, r1o..r4o the next states
# A single photo has no earlier frame, so every run starts from zero states and reads only `pha`.

name: rvm_mobilenetv3_fp32
description: Soft alpha matte of a person with Robust Video Matting
source: https://github.com/PeterL1n/RobustVideoMatting/releases/download/v1.0.0/rvm_mobilenetv3_fp32.onnx
license: GPL-3.0
sha256: 88d4531297118f595bf2fd60f6f566aec2e559393802d1f436c380f0cbbd2828

# How Abra feeds the model (see abra-ai-core: InputSpec). The photo is fitted inside input_size by input_size with
# gray padding; the padding is cut off the matte again. downsample_ratio is the share of the input the model's
# context branch sees, so input_size * downsample_ratio should be near 512 (the model's own advice); the fine detail
# is refined at the full input size.
params:
  input_size: 1024
  input_fit: letterbox
  input_pad: 0.5
  downsample_ratio: 0.5
