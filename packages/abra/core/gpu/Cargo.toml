[package]
name = "gpu"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["rlib"]

[dependencies]
# The wgpu runtime lives in the standalone `gpu-passes` package; this crate plugs it into abra.
gpu-passes = { workspace = true, features = ["runtime"] }
abra-core = { workspace = true }
anyhow = { workspace = true }

[features]
default = []

[dev-dependencies]
env_logger = "0.11"
