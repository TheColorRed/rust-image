[package]
name = "abra-core"
version = "1.0.0"
edition = "2024"

[lib]
crate-type = ["rlib"]

[dependencies]
rayon = { workspace = true }
rand = { workspace = true }
saphyr = { workspace = true }
paste = { workspace = true }
ndarray = { workspace = true, features = ["rayon"] }
image-webp = { version = "0.2.4", optional = true }
# Lossy WebP encoding (image-webp can only encode lossless). Renamed because `webp` is already the name of the feature below.
libwebp = { package = "webp", version = "0.3.1", optional = true }
globwalk = { version = "0.9.1" }
turbojpeg = { version = "1.3.3", optional = true }
png = { version = "0.18.0", optional = true }
resvg = { version = "0.45.1", optional = true }
gif = { version = "0.14.0", optional = true }
primitives = { workspace = true }
uniffi = { version = "=0.31", optional = true }
# Only the plain description of GPU passes: no wgpu and nothing from abra.
gpu-passes = { workspace = true }

[features]
# Exports the library's own types to other languages (see the `primitives` crate).
uniffi = ["dep:uniffi", "primitives/uniffi"]
default = ["webp", "jpg", "png", "svg", "gif"]
webp = ["image-webp", "dep:libwebp"]
jpg = ["turbojpeg"]
png = ["dep:png"]
svg = ["dep:resvg"]
gif = ["dep:gif"]
