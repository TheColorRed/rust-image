[package]
name = "abra"
version = "1.0.0"
edition = "2024"
build = "build.rs"

[dependencies]
abra-core = { workspace = true }
canvas = { workspace = true }
drawing = { workspace = true }
adjustments = { workspace = true }
filters = { workspace = true }
mask = { workspace = true }
options = { workspace = true }
typography = { workspace = true }
tools = { workspace = true }
gpu = { workspace = true, optional = true }
abra-live = { workspace = true, optional = true }
uniffi = { version = "=0.31", optional = true }

rayon = { workspace = true }
ndarray = { workspace = true }
ctor = { workspace = true }

[build-dependencies]
regex = "1.9"

[features]
# GPU acceleration for one-shot edits, and for live rendering when `live` is also on.
gpu = ["dep:gpu", "abra-live?/gpu"]
# Interactive rendering (`live::LiveImage`), for apps that show edits as they are made.
live = ["dep:abra-live"]
# Derives the uniffi types for `live::EffectSpec` and `live::GradientStop`, so bindings share one definition.
uniffi = ["dep:uniffi"]

[lib]
crate-type = ["rlib"]
# Build the internal Rust graph consistently as dynamic libraries.
