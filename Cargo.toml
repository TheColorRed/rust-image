[workspace]
members = [
  # "packages/rxrs",
  "abra/abra",
  "abra/core/*",
  "abra/ai/core",
  "abra/ai/super-resolution",
  "abra/ai/body-segmentation",
  "abra/ai/find-person",
  "abra/plugins/*",
  # Examples
  "apps/examples/*",
  "apps/examples/ai/super-resolution",
  # Bindings for different platforms
  "packages/node/alakazam",
  "packages/react-native/alakazam",
  # Crates for app building
  "packages/vessel/events",
  "packages/vessel/engine",
  "packages/vessel/vessel",
  "packages/vessel/gpu-passes",
  "packages/vessel/surface",
  "packages/vessel/api",
  "packages/vessel/ui",
  "packages/vessel/macros",
]
exclude = ["apps/examples/ai"]
default-members = [
  # "packages/rxrs",
  # "packages/abra",
  # "packages/alakazam",
  "apps/examples/*",
]

resolver = "2"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# Whole-program optimization: cross-crate inlining makes the hot pixel loops faster and drops unused code.
# panic stays "unwind" because UniFFI turns Rust panics into JS errors at the binding boundary.
# No `strip`: uniffi-bindgen-react-native reads the binding metadata from the library's symbols, so a stripped library
# generates empty bindings. Gradle strips the library when it packages the APK.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1

[workspace.dependencies]
rayon = { version = "1.12.0" }
rand = { version = "0.10.3" }
ndarray = { version = "0.17.2", features = ["rayon"] }
wgpu = { version = "30.0.1" }
pollster = { version = "1.0.1" }
bytemuck = { version = "1.25.2" }
futures = { version = "0.3.34" }
anyhow = { version = "1.0.104" }
saphyr = { version = "0.1.0" }
ctor = { version = "1.0.13" }
paste = { version = "1.0.15" }
napi = { version = "3.13.0", default-features = false, features = ["napi4"] }
napi-derive = { version = "3.6.9" }
swash = { version = "0.2.10" }

# Packages
abra = { path = "./abra/abra" }
adjustments = { path = "./abra/core/adjustments" }
canvas = { path = "./abra/core/canvas" }
abra-core = { path = "./abra/core/core" }
drawing = { path = "./abra/core/drawing" }
filters = { path = "./abra/core/filters" }
mask = { path = "./abra/core/mask" }
options = { path = "./abra/core/options" }
primitives = { path = "./abra/core/primitives" }
humanoid = { path = "./abra/core/humanoid" }
tools = { path = "./abra/core/tools" }

gpu = { path = "./abra/core/gpu" }
typography = { path = "./abra/core/typography" }

# Standalone packages that must not depend on abra, so they can be published on their own
pub-sub = { path = "./packages/vessel/events" }
vessel-engine = { path = "./packages/vessel/engine" }
vessel = { path = "./packages/vessel/vessel" }
vessel-api = { path = "./packages/vessel/api" }
vessel-ui = { path = "./packages/vessel/ui" }
vessel-macros = { path = "./packages/vessel/macros" }
gpu-passes = { path = "./packages/vessel/gpu-passes" }
surface = { path = "./packages/vessel/surface" }

# Abra Plugins
collage = { path = "./abra/plugins/collage" }

# Abra AI Packages
abra-ai-core = { path = "./abra/ai/core" }
abra-super-resolution = { path = "./abra/ai/super-resolution" }
abra-body-segmentation = { path = "./abra/ai/body-segmentation" }
abra-find-person = { path = "./abra/ai/find-person" }

[workspace.dependencies.uuid]
version = "1.24.0"
features = ["v4"]
